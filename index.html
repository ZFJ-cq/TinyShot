<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6fb" />
  <title>TinyShot · 纯本地图片压缩</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
      </div>
      <div class="brand-text">
        <h1>TinyShot</h1>
        <p>纯浏览器图片压缩 · 文件不出本机</p>
      </div>
    </div>
    <span class="privacy-badge" title="所有处理均在你的浏览器本地完成">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
      100% 本地处理 · 无上传
    </span>
  </header>

  <main class="container">
    <!-- 参数控制面板 -->
    <section class="panel controls" aria-label="压缩参数">
      <div class="control-group">
        <label class="control-label" for="quality">
          压缩质量 <span class="hint">Quality</span>
        </label>
        <div class="slider-row">
          <input type="range" id="quality" min="0.1" max="1" step="0.01" value="0.8" />
          <output id="qualityValue" class="value-pill">0.80</output>
        </div>
        <p class="control-note" id="qualityNote">数值越低，文件越小、画质损失越多。</p>
      </div>

      <div class="control-group">
        <label class="control-label">输出尺寸</label>
        <div class="seg" role="tablist" aria-label="尺寸模式">
          <button type="button" class="seg-btn active" data-mode="percent" role="tab" aria-selected="true">按比例缩放</button>
          <button type="button" class="seg-btn" data-mode="max" role="tab" aria-selected="false">限定最大边</button>
        </div>

        <div class="mode-fields" id="modePercent">
          <div class="field-row">
            <label for="percent">缩放百分比</label>
            <div class="input-suffix">
              <input type="number" id="percent" min="1" max="100" step="1" value="100" />
              <span class="suffix">%</span>
            </div>
          </div>
        </div>

        <div class="mode-fields hidden" id="modeMax">
          <div class="field-row">
            <label for="maxW">最大宽度</label>
            <div class="input-suffix">
              <input type="number" id="maxW" min="1" step="1" placeholder="如 1920" />
              <span class="suffix">px</span>
            </div>
          </div>
          <div class="field-row">
            <label for="maxH">最大高度</label>
            <div class="input-suffix">
              <input type="number" id="maxH" min="1" step="1" placeholder="如 1080" />
              <span class="suffix">px</span>
            </div>
          </div>
          <p class="control-note">仅缩小、不放大；保持宽高比。</p>
        </div>
      </div>

      <div class="control-group">
        <label class="control-label" for="format">输出格式</label>
        <select id="format">
          <option value="image/jpeg">JPEG（兼容最好）</option>
          <option value="image/webp">WebP（压缩更强）</option>
          <option value="image/png">PNG（无损 / 透明）</option>
        </select>
        <p class="control-note" id="formatNote"></p>
      </div>
    </section>

    <!-- 上传区 -->
    <section
      class="dropzone"
      id="dropzone"
      tabindex="0"
      role="button"
      aria-label="点击或拖拽图片到此处上传"
    >
      <input type="file" id="fileInput" accept="image/*,.heic,.heif,.avif" multiple hidden />
      <div class="dz-inner">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4" />
          <path d="m7 9 5-5 5 5" />
          <path d="M5 20h14" />
        </svg>
        <p class="dz-title">拖拽图片到此处，或 <span class="link">点击选择</span></p>
        <p class="dz-sub">支持批量多选 · JPG / PNG / WebP / GIF(首帧) / HEIC 等</p>
      </div>
    </section>

    <!-- 概览统计 -->
    <section class="summary hidden" id="summary" aria-live="polite">
      <div class="stat">
        <span class="stat-label">原图总大小</span>
        <span class="stat-value" id="sumOriginal">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">压缩后总大小</span>
        <span class="stat-value" id="sumCompressed">—</span>
      </div>
      <div class="stat">
        <span class="stat-label" id="sumSavedLabel">共节省</span>
        <span class="stat-value accent" id="sumSaved">—</span>
      </div>
      <div class="summary-actions">
        <button type="button" class="btn btn-primary" id="downloadAll">下载全部（ZIP）</button>
        <button type="button" class="btn btn-ghost" id="clearAll">清空列表</button>
      </div>
    </section>

    <!-- 图片卡片列表 -->
    <section class="grid" id="grid" aria-label="图片列表"></section>

    <!-- 空状态 -->
    <div class="empty" id="empty">
      <p>还没有图片，先拖几张进来吧 👆</p>
    </div>
  </main>

  <!-- 大图预览 Lightbox -->
  <div class="lightbox hidden" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
    <div class="lightbox-backdrop" data-close></div>
    <div class="lightbox-panel">
      <div class="lightbox-head">
        <span class="lightbox-title" id="lbTitle">预览</span>
        <button type="button" class="lightbox-close" data-close aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
      </div>
      <div class="lightbox-body">
        <figure class="lb-fig">
          <span class="lb-tag">原图</span>
          <div class="lb-imgwrap"><img id="lbOrig" alt="原图大图预览" /></div>
          <figcaption class="lb-cap" id="lbOrigCap">—</figcaption>
        </figure>
        <figure class="lb-fig" id="lbCompFig">
          <span class="lb-tag">压缩后</span>
          <div class="lb-imgwrap"><img id="lbComp" alt="压缩后大图预览" /></div>
          <figcaption class="lb-cap" id="lbCompCap">—</figcaption>
        </figure>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
